spring.application.name=permission-service
server.port=8081

# solo se expone health: el resto de actuator muestra datos internos que nadie afuera necesita
management.endpoints.web.exposure.include=health

# todo lo que cambia entre maquinas entra por variables de entorno (12-factor III).
# El default es la base local en el 5433, porque el 5432 lo usa la del snippet-service.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/permissions}
spring.datasource.username=${DB_USER:permission}
spring.datasource.password=${DB_PASSWORD:permission}

# Auth0. El domain y el audience son configuracion, no secretos. El domain por default es .invalid
# (nunca resuelve) hasta que el grupo cree el tenant: asi falla rapido y no le habla al tenant de otro.
# El client id y secret del M2M (Management API, scope read:users) son secretos: solo por variable de
# entorno, sin default. Sin ellos el servicio levanta igual; solo GET /users y compartir (READ) dan 503
auth0.domain=${AUTH0_DOMAIN:auth0-sin-configurar.invalid}
auth0.m2m.client-id=${AUTH0_M2M_CLIENT_ID:}
auth0.m2m.client-secret=${AUTH0_M2M_CLIENT_SECRET:}
# las claves para validar la firma se bajan del issuer recien con el primer token, no al arrancar
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${auth0.domain}/
# sin esto Spring no valida el aud: aceptaria tokens de Auth0 emitidos para otra API
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://snippet-searcher-api}

# el esquema es de Flyway: Hibernate solo verifica que las entidades coincidan con las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.application.name=permission-service
server.port=8081

# solo se expone health: el resto de actuator muestra datos internos que nadie afuera necesita
management.endpoints.web.exposure.include=health

# todo lo que cambia entre maquinas entra por variables de entorno (12-factor III).
# El default es la base local en el 5433, porque el 5432 lo usa la del snippet-service.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/permissions}
spring.datasource.username=${DB_USER:permission}
spring.datasource.password=${DB_PASSWORD:permission}

# el esquema es de Flyway: Hibernate solo verifica que las entidades coincidan con las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
